# Pull-request gate: broken pack sources can't reach master.
#
# Runs the full pipeline a release would run, plus a freshness check:
#   1. npm ci + npm run build — every pack must compile from packs/_source
#   2. node verify-packs.mjs  — every source document must survive the
#                               LevelDB round-trip (matched by _id)
#   3. node check-scene-maps.mjs — every scene's background.src must exist
#   4. node check-fresh.mjs   — the COMMITTED compiled packs must match what
#                               the committed sources build to. Catches "edited
#                               a source JSON but forgot to recommit packs/".
#
# No release happens here and nothing is pushed — this job only blocks merge.
name: Verify PR

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot committed packs
        run: node check-fresh.mjs snapshot

      - name: Compile all packs from source
        run: npm run build

      - name: Verify round-trip integrity
        run: node verify-packs.mjs

      - name: Check scene map references
        run: node check-scene-maps.mjs

      - name: Freshness — committed packs match sources
        run: node check-fresh.mjs
