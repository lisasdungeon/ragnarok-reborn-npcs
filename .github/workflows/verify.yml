# Pull-request gate: broken pack sources can't reach master.
#
# Runs the full pipeline a release would run, plus freshness checks — via ONE
# script (tools/check_all.py, exposed as `npm run check`) so CI and a local
# `npm run check` execute exactly the same steps in the same order:
#
#   1. sync-npc-sources.py --check — all seven drag-and-drop JSONs match the
#      pack sources (actors: loose→pack, scenes: pack→loose)
#   2. check-documented-data.py — README-documented DCs / attack bonuses /
#      heal formulas match the loose JSONs (both directions), and no
#      regression signatures (non-flat attacks, computed save DCs)
#   3. check-actor-fixes.py --check — the published verification snapshot
#      matches what the loose JSONs build to
#   4. check-fresh.mjs snapshot — packs snapshotted from GIT HEAD (what a
#      clean checkout would contain)
#   5. npm run build — every pack compiles from packs/_source
#   6. verify-packs.mjs — every source document survives the LevelDB
#      round-trip (matched by _id)
#   7. check-scene-maps.mjs — every scene's background.src exists
#   8. check-fresh.mjs — the COMMITTED compiled packs match what the committed
#      sources build to. Catches "edited a source JSON but forgot to recommit
#      packs/".
#
# No release happens here and nothing is pushed — this job only blocks merge.
name: Verify PR

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check pipeline (tools/check_all.py)
        run: npm run check
